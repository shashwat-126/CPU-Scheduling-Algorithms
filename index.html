<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CPU Scheduling Visualizer</title>
<style>
:root{
  --bg:#0d1117; --card:#0f1720; --muted:#94a3b8; --accent:#2ea043; --panel:#0b1220;
  --text:#e6eef8;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
}
.container{max-width:1200px;margin:18px auto;padding:12px;}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.title{font-size:20px;font-weight:700}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls select,input,button{background:transparent;border:1px solid #1f2937;color:var(--text);padding:8px 10px;border-radius:8px}
.controls input[type=number]{width:80px}
.btn{background:linear-gradient(180deg,#238636,#1f7a2b);border:none;padding:8px 12px;color:#fff;border-radius:8px;cursor:pointer}
.btn.secondary{background:#334155}
.panel{background:var(--card);border-radius:10px;padding:14px;margin-top:12px;box-shadow:0 6px 24px rgba(2,6,23,0.6)}
.row{display:flex;gap:12px}
.left{flex:1 1 420px}
.right{flex:1 1 520px}
.table{width:100%;border-collapse:collapse}
.table th, .table td{padding:8px;border-bottom:1px solid #0b1225;text-align:center;color:var(--text)}
.small{font-size:13px;color:var(--muted)}
canvas{width:100%;height:220px;border-radius:8px;background:#071018}
.result-table th, .result-table td{padding:6px;border-bottom:1px solid #0b1225;color:var(--text);font-size:13px;text-align:center}
.footer{margin-top:10px;color:var(--muted);font-size:13px}
.ready-box{margin-top:8px;padding:8px;background:#071522;border-radius:8px;color:var(--text)}
.controls .spacer{width:16px}
.kv{display:flex;gap:8px;align-items:center}
.badge{background:#0b1225;padding:4px 8px;border-radius:6px;font-size:12px;color:var(--muted)}
@media(max-width:900px){
  .row{flex-direction:column}
  .controls{gap:6px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <div class="title">⚙️ CPU Scheduling Visualizer — Dark Dashboard</div>
      <div class="small">Supports FCFS, SJF (pre/non), Priority (pre/non), Round Robin (RR). Manual & Auto step.</div>
    </div>
    <div class="controls">
      <label class="kv">Algorithm:
        <select id="algo">
          <option value="fcfs">FCFS</option>
          <option value="sjf-np">SJF (Non-Preemptive)</option>
          <option value="sjf-p">SJF (Preemptive)</option>
          <option value="priority-np">Priority (Non-Preemptive)</option>
          <option value="priority-p">Priority (Preemptive)</option>
          <option value="rr">Round Robin</option>
        </select>
      </label>
      <label class="kv">Quantum:
        <input id="quantum" type="number" value="2" min="1"/>
      </label>
      <div class="spacer"></div>
      <button class="btn" id="run">Run</button>
      <button class="btn secondary" id="pause">Pause</button>
      <button class="btn secondary" id="next">Next</button>
      <button class="btn secondary" id="reset">Reset</button>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <div class="left">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <input id="pid" placeholder="PID (e.g. P1)" />
          <input id="at" type="number" placeholder="Arrival" style="width:90px"/>
          <input id="bt" type="number" placeholder="Burst" style="width:90px"/>
          <input id="pr" type="number" placeholder="Priority" style="width:90px"/>
          <button class="btn" id="add">Add</button>
          <button class="btn secondary" id="del">Delete Selected</button>
        </div>

        <table class="table">
          <thead>
            <tr><th></th><th>PID</th><th>Arrival</th><th>Burst</th><th>Priority</th></tr>
          </thead>
          <tbody id="procBody"></tbody>
        </table>
        <div class="footer small">Tip: Use unique PIDs (P1, P2...). Priority lower number = higher priority.</div>
      </div>

      <div class="right">
        <div class="panel" style="padding:8px;background:transparent">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div class="small">Gantt Chart</div>
            <div class="small badge" id="timeLabel">Time: 0</div>
          </div>
          <canvas id="gantt"></canvas>
          <div id="readyBox" class="ready-box" style="display:none">
            <strong>Ready Queue:</strong> <span id="readyTxt"></span>
          </div>
        </div>

        <div class="panel" style="margin-top:10px;padding:8px">
          <div class="small">Results</div>
          <table class="result-table" style="width:100%">
            <thead><tr><th>PID</th><th>AT</th><th>BT</th><th>CT</th><th>TAT</th><th>WT</th><th>RT</th></tr></thead>
            <tbody id="resBody"></tbody>
          </table>
          <div style="margin-top:8px" id="averages"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ===== util & state =====
const procBody = document.getElementById('procBody');
const resBody = document.getElementById('resBody');
const readyBox = document.getElementById('readyBox');
const readyTxt = document.getElementById('readyTxt');
const timeLabel = document.getElementById('timeLabel');
const canvas = document.getElementById('gantt');
const ctx = canvas.getContext('2d');

let processes = []; // {pid,at,bt,pr}
let timeline = []; // per time unit pid or null
let readySnapshots = []; // per time unit array of ready pids
let runningIndex = -1;
let timer = null;
let playing = false;
let colors = {};
const palette = [
  '#1abc9c','#e74c3c','#3498db','#9b59b6','#f1c40f','#e67e22','#2ecc71','#16a085',
  '#6c5ce7','#00b894','#fd79a8','#0984e3'
];

// ===== UI helpers =====
function renderProcTable(){
  procBody.innerHTML='';
  processes.forEach((p,i)=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input type="checkbox" data-idx="${i}"/></td>
      <td>${p.pid}</td><td>${p.at}</td><td>${p.bt}</td><td>${p.pr}</td>`;
    procBody.appendChild(tr);
  });
}
function addProcessFromInputs(){
  const pid = document.getElementById('pid').value.trim();
  const at = parseInt(document.getElementById('at').value);
  const bt = parseInt(document.getElementById('bt').value);
  const pr = parseInt(document.getElementById('pr').value || 0);
  if(!pid || isNaN(at) || isNaN(bt) || bt<=0){ alert('Enter valid PID, arrival (>=0), burst(>0)'); return; }
  if(processes.some(x=>x.pid===pid)){ alert('PID must be unique'); return; }
  processes.push({pid,at,bt,pr,remaining:bt});
  renderProcTable();
  document.getElementById('pid').value=''; document.getElementById('at').value=''; document.getElementById('bt').value=''; document.getElementById('pr').value='';
}
function deleteSelected(){
  const checks = Array.from(procBody.querySelectorAll('input[type=checkbox]'));
  const idxs = checks.filter(c=>c.checked).map(c=>parseInt(c.dataset.idx)).sort((a,b)=>b-a);
  idxs.forEach(i=>processes.splice(i,1));
  renderProcTable();
}

// ===== scheduling algorithms (produce timeline and ready snapshots) =====
function scheduleAll(algo, quantum){
  // deep copy and init
  const procs = processes.map(p=>({pid:p.pid, at:p.at, bt:p.bt, pr:p.pr, remaining:p.bt}));
  procs.sort((a,b)=>a.at - b.at || a.pid.localeCompare(b.pid));
  timeline = [];
  readySnapshots = [];

  if(algo==='fcfs'){
    let time = 0, idx=0;
    while(idx<procs.length){
      if(procs[idx].at>time){ // idle until arrival
        timeline.push(null); readySnapshots.push([]);
        time++; continue;
      }
      // run full
      for(let k=0;k<procs[idx].bt;k++){
        timeline.push(procs[idx].pid);
        readySnapshots.push(procs.filter((p,i)=>i>idx && p.at<=time+k).map(p=>p.pid));
      }
      time += procs[idx].bt; procs[idx].completion=time;
      idx++;
    }
  } else if(algo==='sjf-np' || algo==='sjf-p'){
    const pre = (algo==='sjf-p');
    let time=0, completed=0;
    while(completed<procs.length){
      const ready = procs.filter(p=>p.at<=time && p.remaining>0);
      if(ready.length===0){ timeline.push(null); readySnapshots.push([]); time++; continue; }
      let chosen;
      if(pre){
        chosen = ready.reduce((a,b)=> (a.remaining<=b.remaining? a:b));
        chosen.remaining--; timeline.push(chosen.pid);
        readySnapshots.push(ready.filter(r=>r.pid!==chosen.pid).map(r=>r.pid));
        if(chosen.remaining===0){ chosen.completion = time+1; completed++; }
        time++;
      } else {
        chosen = ready.reduce((a,b)=> (a.bt<=b.bt? a:b));
        for(let k=0;k<chosen.bt;k++){
          chosen.remaining--; timeline.push(chosen.pid);
          readySnapshots.push(procs.filter(p=>p.at<=time+k && p.remaining>0 && p.pid!==chosen.pid).map(p=>p.pid));
        }
        time += chosen.bt; chosen.completion=time; completed++;
      }
    }
  } else if(algo==='priority-np' || algo==='priority-p'){
    const pre = (algo==='priority-p');
    let time=0, completed=0;
    while(completed<procs.length){
      const ready = procs.filter(p=>p.at<=time && p.remaining>0);
      if(ready.length===0){ timeline.push(null); readySnapshots.push([]); time++; continue; }
      let chosen;
      if(pre){
        chosen = ready.reduce((a,b)=> (a.pr<=b.pr? a:b));
        chosen.remaining--; timeline.push(chosen.pid);
        readySnapshots.push(ready.filter(r=>r.pid!==chosen.pid).map(r=>r.pid));
        if(chosen.remaining===0){ chosen.completion = time+1; completed++; }
        time++;
      } else {
        chosen = ready.reduce((a,b)=> (a.pr<=b.pr? a:b));
        for(let k=0;k<chosen.bt;k++){
          chosen.remaining--; timeline.push(chosen.pid);
          readySnapshots.push(procs.filter(p=>p.at<=time+k && p.remaining>0 && p.pid!==chosen.pid).map(p=>p.pid));
        }
        time += chosen.bt; chosen.completion=time; completed++;
      }
    }
  } else if(algo==='rr'){
    let time=0, idx=0;
    const queue=[];
    // start at earliest arrival if idle
    while(idx<procs.length || queue.length>0){
      while(idx<procs.length && procs[idx].at<=time){ queue.push(procs[idx]); idx++; }
      if(queue.length===0){ // idle step
        timeline.push(null); readySnapshots.push([]); time++; continue;
      }
      const cur = queue.shift();
      const qt = Math.min(quantum, cur.remaining);
      for(let k=0;k<qt;k++){
        cur.remaining--; timeline.push(cur.pid);
        readySnapshots.push(queue.map(p=>p.pid));
        time++;
        while(idx<procs.length && procs[idx].at<=time){ queue.push(procs[idx]); idx++; }
        if(cur.remaining===0) break;
      }
      if(cur.remaining>0) queue.push(cur); else cur.completion = time;
    }
  }

  // compute completion times for any assigned in timeline:
  // already set completion during algos; ensure for processes that never ran set completion 0
  // build start times for RT
  const startTimes = {};
  timeline.forEach((pid,t)=>{ if(pid && startTimes[pid]===undefined) startTimes[pid]=t; });

  const results = processes.map(p=>{
    const pid=p.pid;
    const original = procs.find(x=>x.pid===pid);
    const ct = original && original.completion? original.completion : (timeline.reduce((acc,cur,i)=> cur===pid? i+1:acc,0));
    const at = p.at, bt = p.bt;
    const tat = ct - at;
    const wt = tat - bt;
    const rt = startTimes[pid]!==undefined? startTimes[pid]-at : 0;
    return {pid,at,bt,ct,tat,wt,rt};
  });
  return {timeline,readySnapshots,results};
}

// ===== drawing gantt =====
function drawGantt(timelineNow){
  const dpr = window.devicePixelRatio||1;
  const W = canvas.clientWidth; const H = canvas.clientHeight;
  canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const unitW = Math.max(24, Math.floor(W / Math.max(8, timelineNow.length||1)));
  const top = 20, height=60;
  // background grid
  ctx.fillStyle='#071018'; ctx.fillRect(0,0,W,H);
  // draw bars
  let lastPid = null;
  for(let i=0;i<timelineNow.length;i++){
    const pid = timelineNow[i];
    const x = i*unitW + 40;
    // vertical time tick
    ctx.strokeStyle='#223'; ctx.beginPath(); ctx.moveTo(x,top+height+10); ctx.lineTo(x,top+height+14); ctx.stroke();
    if(pid){
      if(!colors[pid]) colors[pid]=palette[Object.keys(colors).length % palette.length];
      ctx.fillStyle = colors[pid];
      ctx.fillRect(x, top, unitW, height);
      // label in center
      ctx.fillStyle='white'; ctx.font='12px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(pid, x+unitW/2, top+height/2);
    } else {
      // idle slot - draw faint
      ctx.fillStyle='#08121a'; ctx.fillRect(x, top, unitW, height);
    }
    // vertical separator when pid changes
    const nextPid = timelineNow[i+1];
    if(i===timelineNow.length-1 || nextPid !== pid){
      ctx.strokeStyle='#0e1620'; ctx.beginPath();
      ctx.moveTo(x+unitW, top); ctx.lineTo(x+unitW, top+height); ctx.stroke();
    }
  }
  // draw time numbers
  ctx.fillStyle='#94a3b8'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  for(let i=0;i<=timelineNow.length;i++){
    const x = i*unitW + 40;
    ctx.fillText(i, x + (i>0? unitW/2:0), top+height+28);
  }
  // left axis label 0
  ctx.fillText('0', 40, top+height+28);
}

// ===== simulate & animate control =====
function prepareAndRun(auto=true){
  stopAnimation();
  colors={};
  const algo = document.getElementById('algo').value;
  const q = Math.max(1, parseInt(document.getElementById('quantum').value||2));
  const plan = scheduleAll(algo,q);
  timeline = plan.timeline;
  readySnapshots = plan.readySnapshots;
  const results = plan.results;
  // render results table immediately
  renderResults(results);
  // if algorithm is rr show ready box
  readyBox.style.display = (algo==='rr')? 'block':'none';
  runningIndex = -1;
  if(auto) startAuto();
  else { drawGantt([]); timeLabel.textContent='Time: 0'; }
}
function renderResults(results){
  resBody.innerHTML='';
  let sumT=0,sumW=0,sumR=0;
  results.forEach(r=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${r.pid}</td><td>${r.at}</td><td>${r.bt}</td><td>${r.ct}</td><td>${r.tat}</td><td>${r.wt}</td><td>${r.rt}</td>`;
    resBody.appendChild(tr);
    sumT+=r.tat; sumW+=r.wt; sumR+=r.rt;
  });
  if(results.length){
    const avg=document.createElement('div');
    avg.innerHTML=`<strong>AVG TAT:</strong> ${(sumT/results.length).toFixed(2)} &nbsp; <strong>AVG WT:</strong> ${(sumW/results.length).toFixed(2)} &nbsp; <strong>AVG RT:</strong> ${(sumR/results.length).toFixed(2)}`;
    document.getElementById('averages').innerHTML=''; document.getElementById('averages').appendChild(avg);
  }
}

function startAuto(){
  if(timer) clearInterval(timer);
  playing=true;
  timer = setInterval(()=>{ stepForward(); }, 1000);
}
function stopAnimation(){
  playing=false;
  if(timer){ clearInterval(timer); timer=null; }
}
function stepForward(){
  if(runningIndex < timeline.length-1){
    runningIndex++;
    const now = timeline.slice(0, runningIndex+1);
    drawGantt(now);
    timeLabel.textContent = 'Time: ' + runningIndex;
    // update ready queue if rr
    const algo = document.getElementById('algo').value;
    if(algo==='rr'){ readyTxt.textContent = (readySnapshots[runningIndex]||[]).join(', '); }
    else{ readyTxt.textContent=''; }
  } else {
    stopAnimation();
    timeLabel.textContent = 'Simulation finished';
  }
}

// ===== UI bindings =====
document.getElementById('add').addEventListener('click', addProcessFromInputs);
document.getElementById('del').addEventListener('click', deleteSelected);
document.getElementById('run').addEventListener('click', ()=>prepareAndRun(true));
document.getElementById('pause').addEventListener('click', ()=>{ if(playing) stopAnimation(); else startAuto(); });
document.getElementById('next').addEventListener('click', ()=>{ stopAnimation(); stepForward(); });
document.getElementById('reset').addEventListener('click', ()=>{ stopAnimation(); timeline=[]; readySnapshots=[]; runningIndex=-1; drawGantt([]); resBody.innerHTML=''; document.getElementById('averages').innerHTML=''; timeLabel.textContent='Time: 0'; readyTxt.textContent=''; readyBox.style.display='none'; colors={}; });

window.addEventListener('resize', ()=>{ drawGantt(timeline.slice(0, runningIndex+1)); });

// initial demo
// add two sample processes
processes.push({pid:'P1',at:0,bt:4,pr:1});
processes.push({pid:'P2',at:1,bt:3,pr:2});
renderProcTable();
</script>
</body>
</html>
